<style>
  @property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }

  /* animated gradient mesh — slow-drifting purple/teal blobs on near-black */
  .bg-mesh { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(60% 60% at 20% 26%, rgba(76,29,149,.55), transparent 62%),
      radial-gradient(55% 55% at 82% 24%, rgba(6,78,59,.5), transparent 62%),
      radial-gradient(60% 60% at 74% 82%, rgba(49,10,101,.5), transparent 62%),
      radial-gradient(52% 52% at 22% 84%, rgba(15,118,110,.42), transparent 62%),
      #05060d;
    background-size: 180% 180%;
    filter: blur(30px) saturate(1.05);
    animation: meshmove 28s ease-in-out infinite alternate; }
  @keyframes meshmove {
    0%   { background-position: 0% 0%, 100% 0%, 100% 100%, 0% 100%; }
    100% { background-position: 100% 100%, 0% 100%, 0% 0%, 100% 0%; }
  }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .bg-mesh { animation: none; } }

  .app { position: relative; z-index: 3; margin: 0 auto; padding: 6vh 2in 14vh;   /* 2-inch gutter each side */
    display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
  @media (max-width: 900px) { .app { padding: 6vh 20px 12vh; } }

  /* electric glowing border, shared by date/quote boxes and the active task */
  .glow, .task.active { position: relative; }
  .glow > *, .task.active > * { position: relative; z-index: 2; }
  .glow::before, .glow::after,
  .task.active::before, .task.active::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px; z-index: 1;
    background: conic-gradient(from var(--ang),
      #38e1ff, #7cf6ff, #8fe6c2, #ffe08a, #ff8fd0, #b46bff, #38e1ff);   /* full colorful edge */
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 2s linear infinite;
  }
  .glow::after, .task.active::after { filter: blur(9px); opacity: .8; }
  @keyframes spin { to { --ang: 360deg; } }

  .glow { border-radius: 18px; }
  .datebox { width: 100%; padding: 20px 34px; background: rgba(6,14,11,.32); backdrop-filter: blur(4px); }
  .date { font-family: "Sora", sans-serif; font-weight: 800; letter-spacing: -.01em; color: #fff; white-space: nowrap;
    font-size: clamp(40px, 6.6vw, 88px); line-height: 1; margin: 0; text-shadow: 0 3px 22px rgba(0,0,0,.85); }
  .quotebox { width: 100%; padding: 22px 30px; background: rgba(6,14,11,.42); backdrop-filter: blur(6px); }
  .quote { font-size: clamp(16px, 1.7vw, 21px); line-height: 1.4; font-style: italic; color: #eef6f2; }
  .quote b { font-style: normal; font-weight: 600; font-size: .9em; color: #b9dcd2; white-space: nowrap; }

  .tabs { display: flex; gap: 14px; margin-top: 8px; }
  .tab { padding: 15px 40px; font-size: 20px; font-weight: 700; letter-spacing: .03em; border-radius: 999px; cursor: pointer;
    color: #dbeee7; background: rgba(6,14,11,.4); border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(6px);
    transition: transform .12s ease; }
  .tab:hover { transform: translateY(-1px); }
  .tab.on { color: #062018; background: linear-gradient(90deg,#9df0ff,#8fe6c2); border-color: transparent;
    box-shadow: 0 0 26px rgba(140,240,210,.55); }
  .tab .badge { display: inline-block; min-width: 26px; margin-left: 10px; padding: 1px 9px; font-size: 15px; line-height: 22px;
    text-align: center; border-radius: 999px; background: rgba(255,255,255,.18); }
  .tab.on .badge { background: rgba(0,0,0,.18); }

  form { display: flex; gap: 10px; width: 100%; }
  #task { flex: 1; padding: 16px 18px; font-size: 20px; color: #f3f7f6; border-radius: 13px;
    border: 1px solid rgba(255,255,255,.18); background: rgba(6,14,11,.5); backdrop-filter: blur(6px); }
  #task::placeholder { color: #9fbdb2; }
  #task:focus { outline: none; border-color: #9df0ff; box-shadow: 0 0 0 1px #9df0ff, 0 0 22px rgba(140,240,210,.35); }
  button.add { padding: 0 22px; font-size: 24px; font-weight: 800; cursor: pointer; border: none; border-radius: 13px;
    color: #062018; background: linear-gradient(90deg,#9df0ff,#8fe6c2); box-shadow: 0 0 22px rgba(140,240,210,.4); }

  ul { list-style: none; margin: 4px 0 0; padding: 0; width: 100%; }
  .task { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; margin-bottom: 10px;
    border-radius: 14px; border: 1px solid rgba(255,255,255,.14); background: rgba(6,14,11,.5); backdrop-filter: blur(8px);
    cursor: pointer; transition: transform .12s ease; }

  .task.active { border-color: transparent; }
  .task input[type=checkbox] { width: 24px; height: 24px; accent-color: #8fe6c2; cursor: pointer; flex: none; }
  .task .txt { flex: 1; font-size: 20px; font-weight: 500; }
  .task .date { font-size: 12px; font-weight: 700; color: #bfeede; font-variant-numeric: tabular-nums; white-space: nowrap;
    padding: 4px 11px; border-radius: 999px; background: rgba(143,230,194,.14); border: 1px solid rgba(143,230,194,.35); }
  .empty { color: #a7c4bc; font-size: 15px; padding: 8px 2px; }
  .task.leaving { animation: pop .28s ease forwards; }
  @keyframes pop { to { transform: scale(.82); opacity: 0; } }
  [hidden] { display: none !important; }

<div class="bg-mesh"></div>

    <form id="add">
      <input id="task" type="text" placeholder="Add a task for today…" autocomplete="off" required>
      <button class="add" type="submit" aria-label="Add task">+</button>
    </form>
    <ul id="list"></ul>
  </section>

  <section id="view-pending" hidden style="width:100%;display:flex;justify-content:center">
    <ul id="pending"></ul>
  </section>
</div>

const now = new Date();
const doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 864e5);
const qq = QUOTES[doy % QUOTES.length];
document.getElementById("today").textContent = now.toLocaleDateString("en-US", { month:"long", day:"numeric", year:"numeric" });
document.getElementById("q").innerHTML = `“${qq[0]}” <b>— ${qq[1]}</b>`;

// ---------- tasks ----------
const KEY = "todo.tasks";
// local YYYY-MM-DD so grouping matches the displayed (local) date
const todayStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const load = () => {
  try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
  catch { return []; }
};
const save = t => {
  try { localStorage.setItem(KEY, JSON.stringify(t)); }
  catch (e) { console.warn("Could not save tasks:", e); }
};
let tasks = load();
let activeId = null;

function render() {
  const today = todayStr();
  const list = document.getElementById("list");
  const pending = document.getElementById("pending");
  list.innerHTML = ""; pending.innerHTML = "";

  const todays = tasks.filter(t => t.date === today);
  const olds   = tasks.filter(t => t.date <  today);

  todays.forEach(t => list.appendChild(row(t, false)));
  olds.forEach(t => pending.appendChild(row(t, true)));

  if (!todays.length) list.innerHTML = '<div class="empty">No tasks yet. Add your first one above.</div>';
  if (!olds.length) pending.innerHTML = '<div class="empty">Nothing pending. Clean slate. 🌿</div>';
  document.getElementById("pcount").textContent = olds.length;
}

function row(t, showDate) {
  const li = document.createElement("li");
  li.className = "task" + (t.id === activeId ? " active" : "");
  li.onclick = e => { if (e.target.tagName === "INPUT") return;   // clicking the card focuses it (electric border)
    activeId = (activeId === t.id) ? null : t.id; render(); };

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.onchange = () => complete(t, li);

  const txt = document.createElement("span");
  txt.className = "txt";
  txt.textContent = t.text;

  li.append(cb, txt);
  if (showDate) {
    const d = document.createElement("span");
    d.className = "date";
    d.textContent = new Date(t.date + "T00:00").toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
    li.append(d);
  }
  return li;
}

// completing a task deletes it forever — never stored
function complete(task, li) {
  li.classList.add("leaving");
  setTimeout(() => {
    tasks = tasks.filter(x => x !== task);
    if (activeId === task.id) activeId = null;
    save(tasks); render();
  }, 260);
}

document.getElementById("add").onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById("task");
  const text = input.value.trim();
  if (!text) return;
  tasks.push({ id: Date.now() + "-" + Math.random().toString(36).slice(2,7), text, date: todayStr() });
  save(tasks); input.value = ""; render();
};

document.querySelectorAll(".tab").forEach(tab => tab.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === tab));
  const t = tab.dataset.tab;
  document.getElementById("view-today").hidden = t !== "today";
  document.getElementById("view-pending").hidden = t !== "pending";
});

render();

// ---------- drifting glowing fireflies over the animated mesh ----------
const cv = document.getElementById("fx"), x = cv.getContext("2d");
const COUNT = 120;
// hues that glow on dark purple/teal: sky, violet, mint, gold, lilac
const PALETTE = [[125,211,252],[167,139,250],[94,234,212],[253,224,138],[209,196,255]];
const RND = (a,b) => a + Math.random()*(b-a);
let W, H, flies, t = 0, paused = false;
function fxBuild() {
  const d = Math.min(devicePixelRatio||1, 2);
  cv.width = innerWidth*d; cv.height = innerHeight*d; x.setTransform(d,0,0,d,0,0);
  W = innerWidth; H = innerHeight;
  flies = Array.from({length:COUNT}, () => ({
    x: Math.random()*W, y: Math.random()*H, r: RND(1.5,3.9),
    vx: RND(-0.15,0.15), vy: RND(-0.65,-0.15), ph: Math.random()*7, tw: RND(0.6,2.3),
    c: PALETTE[(Math.random()*PALETTE.length)|0],
  }));
}
fxBuild(); addEventListener("resize", fxBuild);
document.addEventListener("visibilitychange", () => {                 // pause when tab hidden (battery)
  paused = document.hidden; if (!paused) requestAnimationFrame(fxDraw);
});
function fxDraw() {
  if (paused) return;
  t += 0.035;
  x.clearRect(0,0,W,H);
  for (const f of flies) {
    f.x += f.vx; f.y += f.vy;
    if (f.y < -6) { f.y = H+6; f.x = Math.random()*W; }
    if (f.x < -6) f.x = W+6; if (f.x > W+6) f.x = -6;
    const a = 0.4 + 0.55*Math.sin(t*f.tw + f.ph);
    const [r,g,b] = f.c;
    // colored glow halo
    const grad = x.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r*4.2);
    grad.addColorStop(0, `rgba(${r},${g},${b},${0.55*a})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
    x.fillStyle = grad;
    x.beginPath(); x.arc(f.x, f.y, f.r*4.2, 0, 7); x.fill();
    // bright core with bloom
    x.fillStyle = `rgba(255,255,255,${0.95*a})`;
    x.shadowBlur = 16; x.shadowColor = `rgb(${r},${g},${b})`;
    x.beginPath(); x.arc(f.x, f.y, f.r, 0, 7); x.fill();
    x.shadowBlur = 0;
  }
  requestAnimationFrame(fxDraw);
}
if (matchMedia("(prefers-reduced-motion: reduce)").matches) fxDraw();  // single frame
else fxDraw();
